name: Daily Digest

on:
  schedule:
    # GitHub Actions 使用 UTC；12:00 UTC = 20:00 Asia/Shanghai
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # secrets 不能在 if 条件里直接引用，需先映射到 env 再判断
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_PRICE_INPUT_PER_1M: ${{ secrets.LLM_PRICE_INPUT_PER_1M }}
      LLM_PRICE_OUTPUT_PER_1M: ${{ secrets.LLM_PRICE_OUTPUT_PER_1M }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Restore published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
        continue-on-error: true

      - name: Collect candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py collect

      # 可选 AI 增强：仅在仓库配置了 LLM_API_KEY + LLM_MODEL 时执行；
      # 未配置则跳过，报告自动使用规则兜底文案（不影响发布）。
      - name: AI enrichment (optional)
        if: ${{ env.LLM_API_KEY != '' && env.LLM_MODEL != '' }}
        run: |
          python enrich.py --enable --max-cost 0.05
          python monitor.py validate || true

      - name: Generate today's report (consumer)
        run: python monitor.py report

      - name: Collect developer candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py --profile dev collect

      # 程序员榜 AI 文案同样是可选的；未配置密钥时自动跳过。
      - name: AI enrichment (developer, optional)
        if: ${{ env.LLM_API_KEY != '' && env.LLM_MODEL != '' }}
        run: |
          python enrich.py --profile dev --enable --max-cost 0.05
          python monitor.py --profile dev validate || true

      - name: Generate today's ranking (developer)
        run: python monitor.py --profile dev report

      - name: Merge reports into site
        run: |
          mkdir -p site/dev
          rm -rf site/.git
          cp reports/github-daily-*.html site/ 2>/dev/null || true
          cp reports/github-daily-*.md site/ 2>/dev/null || true
          cp reports-dev/dev-daily-*.html site/dev/ 2>/dev/null || true
          cp reports-dev/dev-daily-*.md site/dev/ 2>/dev/null || true

      - name: Build archive index (both editions)
        env:
          REPO_URL: https://github.com/${{ github.repository }}
        run: python tools/build_index.py site --all

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "docs: update daily digest"